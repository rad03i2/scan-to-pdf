[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scan-to-pdf"
version = "1.0.0"
description = "Local CLI that turns scanned images into clean multi-page PDF documents."
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Radwan Abdulhadi Ahmed"}]
dependencies = ["Pillow>=10.0,<12"]

[project.scripts]
scan-to-pdf = "scan_to_pdf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
